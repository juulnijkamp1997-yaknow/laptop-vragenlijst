<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0a">
<title>Vragenlijst nieuwe laptop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&amp;display=swap">
<style>
/* VOICE: calm, warm, plain Dutch; one quiet page, nothing technical in sight.
   IDEA: a low-vision intake card printed white on dark board, read top to bottom.
   PICTURE: the questionnaire itself, under a fixed black band carrying one safety-yellow progress bar.
   COLOUR and TYPE: always dark (#161615), off-white text, yellow #ffe600 for progress, choices and the send button; Atkinson Hyperlegible Next.
   LAYOUT: one long column (max 46rem), fixed progress band, big tap targets, two option columns on the unfolded Fold screen. */
:root{color-scheme:dark;--bg:#161615;--ink:#f2f2ee;--muted:#c9c9c2;--plane:#262624;--line:#8a8a83;--band:#0b0b0a;--track:#3f3f3b;--yellow:#ffe600;--hh:60px}
html{font-size:112.5%;background:var(--bg);scroll-padding-top:calc(var(--hh) + 16px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box;min-width:0}
body{margin:0;padding-top:var(--hh);background:var(--bg);color:var(--ink);font:400 1rem/1.55 "Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,Roboto,"Segoe UI",Arial,sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--band);border-bottom:1px solid #2c2c29;padding:14px max(4vw,16px)}
.top-in{max-width:46rem;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar{flex:1;height:14px;border-radius:8px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--yellow);border-radius:8px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
.pct{flex:none;font-weight:800;font-size:min(1rem,20px);white-space:nowrap}

main{max-width:46rem;margin:0 auto;padding:clamp(24px,4vw,44px) max(4vw,16px) 88px}
h1{font-size:clamp(2rem,1.5rem + 2.4vw,2.8rem);font-weight:800;line-height:1.08;text-wrap:balance;margin:.1em 0 .45em;letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,1.3rem + 1.4vw,2.1rem);font-weight:800;line-height:1.12;text-wrap:balance;margin:0 0 .35em}
h1:focus,h2:focus{outline:none}
.lead{font-size:1.2rem;line-height:1.5;max-width:60ch;margin:0 0 .8em}
.intro{color:var(--muted);max-width:60ch;margin:0}
.small{font-size:.9rem;color:var(--muted)}
.sec{margin-top:56px;padding-top:28px;border-top:3px solid var(--plane)}

.q{border:0;margin:34px 0 0;padding:0}
.q legend{display:block;width:100%;padding:0;margin:0 0 8px;font-size:1.2rem;font-weight:700;line-height:1.3}
.help{margin:0 0 12px;color:var(--muted);max-width:62ch}
.max{font-weight:700;color:var(--ink)}
.max:empty{display:none}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr));margin-top:10px}
.opt{display:flex;gap:12px;align-items:center;min-height:3.2rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:transparent;cursor:pointer;line-height:1.35}
.opt input{appearance:none;-webkit-appearance:none;flex:none;width:1.45rem;height:1.45rem;margin:0;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;background:transparent;cursor:pointer}
.opt input[type=checkbox]{border-radius:6px}
.opt input:checked::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:currentColor}
.opt input[type=checkbox]:checked::before{width:.95rem;height:.95rem;border-radius:0;clip-path:polygon(12% 50%,0 64%,38% 100%,100% 22%,87% 9%,38% 72%)}
.opt input:focus-visible{outline:none}
.opt:has(input:focus-visible){outline:3px solid var(--yellow);outline-offset:3px}
.opt:has(input:checked){background:var(--yellow);color:#111;border-color:var(--yellow)}
.opt:has(input:disabled){opacity:.4;cursor:not-allowed}
@media (hover:hover){.opt:hover{border-color:var(--ink)}}
.note-btn{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;padding:6px 0;border:0;background:none;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
textarea,input[type=text]{display:block;width:100%;font-size:max(1rem,16px);background:#0f0f0e;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45}
textarea{min-height:6.5rem;resize:vertical}
textarea::placeholder,input::placeholder{color:#9d9d96}
.note{margin-top:6px}
.count{margin:6px 0 0;font-size:.9rem;color:var(--muted)}
.count:empty{display:none}

.end{margin-top:64px;padding:28px 0 0;border-top:3px solid var(--plane)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:4rem;padding:14px 22px;border-radius:14px;border:2px solid var(--yellow);background:var(--yellow);color:#111;font-weight:800;font-size:1.3rem;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;margin:18px 0 10px}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-size:1.05rem;min-height:3.4rem;width:auto;display:inline-flex}
.err{color:var(--yellow);font-weight:700;margin:6px 0}
.err:empty{display:none}
.thanks{min-height:calc(100dvh - var(--hh) - 140px);display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.thanks h1{font-size:clamp(2.3rem,1.7rem + 3vw,3.4rem)}
.mark{width:84px;height:84px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;margin-bottom:22px}
.mark svg{width:46px;height:46px}
</style>
</head>

const parseOpt=(s,i)=>{let x=false,o=false;if(s[0]==='!'){x=true;s=s.slice(1)}else if(s[0]==='+'){o=true;s=s.slice(1)}const k=s.indexOf('|');return k>0?{v:s.slice(0,k),l:s.slice(k+1),x,o}:{v:'o'+i,l:s,x,o}};
const Q={};
P.forEach((p,pi)=>p.q.forEach((q,qi)=>{if(q.o)q.o=q.o.map(parseOpt);Q[q.id]={q,pi,qi}}));

const $=id=>document.getElementById(id);
const main=$('main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vis=q=>{if(!q.show)return true;const v=S.a[q.show.id];return Array.isArray(v)?v.some(x=>q.show.any.includes(x)):q.show.any.includes(v)};
const done=q=>{const v=S.a[q.id];if(q.t==='m')return Array.isArray(v)&&v.length>0;if(q.t==='1')return typeof v==='string'&&v!=='';return typeof v==='string'&&v.trim()!==''};
const counts=()=>{let a=0,t=0;P.forEach(p=>p.q.forEach(q=>{if(vis(q)){t++;if(done(q))a++}}));return{a,t}};
const ansText=q=>{const v=S.a[q.id];if(v==null)return'';if(q.t==='text'||q.t==='line')return String(v).trim().replace(/\s+/g,' ');if(q.t==='1'){const o=q.o.find(o=>o.v===v);return o?o.l:''}return(Array.isArray(v)?v:[]).map(x=>q.o.find(o=>o.v===x)).filter(Boolean).map(o=>o.l).join('; ')};
const nameVal=()=>String(S.a.naam||'').trim().replace(/\s+/g,' ').slice(0,80);
const fmt=d=>{try{return new Intl.DateTimeFormat('nl-NL',{dateStyle:'long',timeStyle:'short'}).format(d)}catch(e){return d.toISOString()}};
function build(withDate){
 const{a,t}=counts();
 let head='Laptop-vragenlijst van '+(nameVal()||'(geen naam ingevuld)')+'\n';
 if(withDate)head+='Verzonden: '+fmt(new Date())+'\n';
 head+='Beantwoord: '+a+' van '+t+' vragen\n';
 const skipped=[];
 const blocks=P.map((p,pi)=>{let b='\n--- Deel '+(pi+1)+': '+p.t+' ---\n',any=false;
  p.q.forEach((q,qi)=>{if(!vis(q))return;const ans=ansText(q),note=(S.n[q.id]||'').trim().replace(/\s+/g,' ');
   if(!ans&&!note){skipped.push(q.s);return}
   any=true;b+=(pi+1)+'.'+(qi+1)+' '+q.s+': '+(ans||'(geen keuze)')+'\n';if(note&&q.o)b+='    Toelichting: '+note+'\n'});
  return any?b:''}).filter(Boolean);
 if(skipped.length)blocks.push('\nOvergeslagen: '+skipped.join('; ')+'\n');
 return{head,blocks};
}
const fullText=withDate=>{const r=build(withDate);return r.head+r.blocks.join('')};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)};
const urlFor=(name,txt)=>FORM+'?'+new URLSearchParams([[E_NAAM,name],[E_TXT,txt],['submit','Submit']]).toString();
function chunks(){
 const name=nameVal(),r=build(true),fits=s=>urlFor(name,'Zending 9 van 9\n'+s).length<=MAXURL,out=[];
 let cur=r.head;const push=()=>{if(cur.trim())out.push(cur);cur=''};
 for(const b of r.blocks){
  if(fits(cur+b)){cur+=b;continue}
  if(fits(b)&&cur!==r.head){push();cur=b;continue}
  for(const ln of b.split('\n')){const l=ln+'\n';if(fits(cur+l))cur+=l;else{push();cur=fits(l)?l:l.slice(0,1200)+'…\n'}}
 }
 push();
 return out.length>1?out.map((c,i)=>'Zending '+(i+1)+' van '+out.length+'\n'+c):out;
}

function qHTML(q){

 if(q.h)h+='<p class="help" id="h-'+id+'">'+esc(q.h)+'</p>';
 if(q.max)h+='<p class="help max" id="m-'+id+'" aria-live="polite"></p>';
 if(q.o){
  const type=q.t==='1'?'radio':'checkbox',v=S.a[id];
  h+='<div class="opts">'+q.o.map(o=>{const on=q.t==='1'?v===o.v:Array.isArray(v)&&v.includes(o.v);
   return '<label class="opt"><input type="'+type+'" name="'+id+'" value="'+esc(o.v)+'"'+(on?' checked':'')+(o.x?' data-x="1"':'')+(o.o?' data-o="1"':'')+'><span>'+esc(o.l)+'</span></label>'}).join('')+'</div>';
  const n=S.n[id]||'',open=n.trim()!=='';
  h+='<button type="button" class="note-btn" data-note="'+id+'" aria-expanded="'+open+'" aria-controls="n-'+id+'">'+(open?'Toelichting verbergen':'+ Toelichting toevoegen (optioneel)')+'</button>'
   +'<div class="note" id="n-'+id+'"'+(open?'':' hidden')+'><label class="sr" for="t-'+id+'">Toelichting</label><textarea id="t-'+id+'" data-tnote="'+id+'" maxlength="300" rows="3" placeholder="Typ of spreek hier je toelichting in">'+esc(n)+'</textarea><p class="count" id="c-'+id+'"></p></div>';
 }else if(q.t==='text'){
  h+='<textarea id="a-'+id+'" data-text="'+id+'" maxlength="800" rows="4" aria-labelledby="l-'+id+'"'+(q.h?' aria-describedby="h-'+id+'"':'')+' placeholder="Typ of spreek hier je antwoord in">'+esc(S.a[id]||'')+'</textarea><p class="count" id="c-'+id+'"></p>';
 }else{
  h+='<input type="text" id="a-'+id+'" data-text="'+id+'" maxlength="80" autocomplete="name" aria-labelledby="l-'+id+'"'+(q.h?' aria-describedby="h-'+id+'"':'')+' value="'+esc(S.a[id]||'')+'">';
 }
 return h+'</fieldset>';
}

function setTop(pct,label){$('fill').style.width=pct+'%';const b=$('bar');b.setAttribute('aria-valuenow',pct);b.setAttribute('aria-valuetext',label);$('pct').textContent=pct+'%'}
function updateTop(){const c=counts(),pct=c.t?Math.round(c.a/c.t*100):0;setTop(pct,pct+' procent ingevuld')}
let endT=0;
function updateEnd(){
 const tally=$('tally');if(!tally)return;
 const c=counts();
 tally.textContent=c.a===c.t?'Je hebt alle '+c.t+' vragen beantwoord.':'Je hebt '+c.a+' van de '+c.t+' vragen beantwoord. Overgeslagen vragen mag je leeg laten.';
 const area=$('sendArea');
 if(SILENT){if(!$('sendBtn'))area.innerHTML='<button type="button" class="btn" id="sendBtn">Verzenden</button>';return}
 const ch=chunks(),name=nameVal(),cur=hash(fullText(false)),parts=S.sentFor===cur?S.sentParts:[];
 area.innerHTML=ch.map((t,i)=>'<a class="btn" href="'+esc(urlFor(name,t))+'" target="_blank" rel="noopener" data-send="'+i+'">'+(ch.length>1?'Verzenden: deel '+(i+1)+' van '+ch.length:'Verzenden')+(parts[i]?' (verzonden)':'')+'</a>').join('');
}
const queueEnd=()=>{clearTimeout(endT);endT=setTimeout(updateEnd,250)};

function counter(t){const c=$('c-'+(t.dataset.tnote||t.dataset.text));if(!c)return;const m=+t.maxLength,l=t.value.length;c.textContent=m>0&&l>=m*.8?'Nog '+(m-l)+' tekens over':''}
function enforceMax(q){const fs=$('q-'+q.id);if(!fs)return;const bs=[...fs.querySelectorAll('input')],n=bs.filter(b=>b.checked).length;bs.forEach(b=>{b.disabled=!b.checked&&n>=q.max});const m=$('m-'+q.id);if(m)m.textContent=n>=q.max?'Je hebt er '+q.max+' gekozen. Haal er eerst een weg als je wilt wisselen.':''}
function updateVis(){P.forEach(p=>p.q.forEach(q=>{if(q.show){const fs=$('q-'+q.id);if(fs)fs.hidden=!vis(q)}}))}
function openNote(id,focus,why){const b=main.querySelector('[data-note="'+id+'"]'),box=$('n-'+id);if(!box||!b)return;box.hidden=false;b.setAttribute('aria-expanded','true');b.textContent='Toelichting verbergen';const ta=$('t-'+id);if(why)ta.placeholder='Wat bedoel je met ‘'+why+'’?';if(focus)ta.focus()}

function showForm(){main.innerHTML=formHTML();P.forEach(p=>p.q.forEach(q=>{if(q.max)enforceMax(q)}));main.querySelectorAll('textarea').forEach(counter);updateTop();updateEnd()}

async function sendSilent(){
 const btn=$('sendBtn'),err=$('err');if(!btn||btn.disabled)return;
 err.textContent='';btn.disabled=true;btn.textContent='Bezig met verzenden…';
 const body=new URLSearchParams([[E_NAAM,nameVal()],[E_TXT,fullText(true)],['fvv','1'],['pageHistory','0']]);
 const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);
 try{
  await fetch(FORM,{method:'POST',mode:'no-cors',body,signal:ac.signal});
  clearTimeout(tm);S.sentAt=new Date().toISOString();S.sentHash=hash(fullText(false));saveNow();showThanks();
 }catch(e){
  clearTimeout(tm);btn.disabled=false;btn.textContent='Verzenden';
  err.textContent='Verzenden lukte niet. Controleer je internetverbinding en tik nog een keer op Verzenden.';
 }
}
function markSent(i){const cur=hash(fullText(false)),n=chunks().length;if(S.sentFor!==cur){S.sentFor=cur;S.sentParts=[]}S.sentParts[i]=true;let all=true;for(let k=0;k<n;k++)if(!S.sentParts[k])all=false;if(all){S.sentHash=cur;S.sentAt=new Date().toISOString();saveNow();setTimeout(showThanks,700)}else{saveNow();setTimeout(updateEnd,300)}}

main.addEventListener('change',e=>{
 const t=e.target;if(!(t instanceof HTMLInputElement)||(t.type!=='radio'&&t.type!=='checkbox'))return;
 const info=Q[t.name];if(!info)return;const q=info.q,id=q.id;
 if(t.type==='radio')S.a[id]=t.value;
 else{const bs=[...$('q-'+id).querySelectorAll('input[type=checkbox]')];
  if(t.checked){if(t.dataset.x)bs.forEach(b=>{if(b!==t)b.checked=false});else bs.forEach(b=>{if(b.dataset.x)b.checked=false})}
  const vals=bs.filter(b=>b.checked).map(b=>b.value);if(vals.length)S.a[id]=vals;else delete S.a[id];
  if(q.max)enforceMax(q)}
 if(t.checked&&t.dataset.o){const o=q.o.find(o=>o.v===t.value);openNote(id,true,o?o.l:'')}
 updateVis();updateTop();queueEnd();save();
});
main.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.tnote){S.n[t.dataset.tnote]=t.value;counter(t);queueEnd();save()}
 else if(t.dataset.text){S.a[t.dataset.text]=t.value;if(t.tagName==='TEXTAREA')counter(t);updateTop();queueEnd();save()}
});
main.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b||!main.contains(b))return;const d=b.dataset;
 if(d.note){const box=$('n-'+d.note);if(box.hidden)openNote(d.note,true);else{box.hidden=true;b.setAttribute('aria-expanded','false');b.textContent='+ Toelichting toevoegen (optioneel)'}}
 else if(b.id==='sendBtn')sendSilent();
 else if(d.send!=null)markSent(+d.send);
 else if(d.edit){showForm();window.scrollTo(0,0);const h=$('vh');if(h)h.focus({preventScroll:true})}
});
const top=$('top');
const hro=new ResizeObserver(()=>document.documentElement.style.setProperty('--hh',top.offsetHeight+'px'));
hro.observe(top);
if(S.sentAt&&S.sentHash&&S.sentHash===hash(fullText(false)))showThanks();else showForm();
}
</script>
</body>
</html>
